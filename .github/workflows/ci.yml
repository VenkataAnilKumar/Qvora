name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    name: Go API (vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/services/api/go.mod
          cache-dependency-path: src/services/api/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  worker:
    name: Go Worker (vet, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/services/worker/go.mod
          cache-dependency-path: src/services/worker/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  postprocess:
    name: Rust postprocess (build --features ffmpeg, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/services/postprocess
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/services/postprocess
      # Same ffmpeg dev libs as the service Dockerfile — the feature is optional
      # specifically so this crate can also build without them, but CI should
      # validate the configuration that actually ships.
      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libavcodec-dev libavformat-dev libavfilter-dev \
            libavutil-dev libswscale-dev libswresample-dev libavdevice-dev clang
      - run: cargo build --release --features ffmpeg
      - run: cargo test --features ffmpeg
      # Non-blocking for now — this is a first-ever CI pass on an existing
      # codebase with no prior lint baseline; flip to a hard gate once clean.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --features ffmpeg --all-targets -- -D warnings
